<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Market Index Prices</title>
</head>
<body>
    <h1>Real-Time Market Index Prices</h1>
    <p><strong>S&P 500:</strong> <span id="sp500">Loading...</span></p>
    <p><strong>Dow Jones:</strong> <span id="dowjones">Loading...</span></p>
    <p><strong>Nasdaq:</strong> <span id="nasdaq">Loading...</span></p>
    <p><strong>Nifty 50:</strong> <span id="nifty50">Loading...</span></p>

    <script>
        const apiKey = "ZRD1DJCIMCB8HEZ1";  // Replace with your actual Alpha Vantage API key
        const indices = {
            "NIFTY50": "nifty50",  // Corrected symbol for Nifty 50
            "SPY": "sp500",  // S&P 500 ETF (instead of ^GSPC)
            "DIA": "dowjones",  // Dow Jones ETF (instead of ^DJI)
            "QQQ": "nasdaq"   // Nasdaq ETF (instead of ^IXIC)
        };

        async function fetchIndexData(symbol, elementId) {
            try {
                const response = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${apiKey}`);
                const data = await response.json();
                console.log(`Response for ${symbol}:`, data); // Log response

                if (data["Global Quote"] && data["Global Quote"]["05. price"]) {
                    document.getElementById(elementId).innerText = "$" + data["Global Quote"]["05. price"];
                } else {
                    document.getElementById(elementId).innerText = "Data unavailable";
                    console.error("Unexpected API response:", data);
                }
            } catch (error) {
                document.getElementById(elementId).innerText = "Error loading data";
                console.error("Error fetching data:", error);
            }
        }

        function updateAllIndices() {
            for (let symbol in indices) {
                fetchIndexData(symbol, indices[symbol]);
            }
        }

        updateAllIndices(); // Initial fetch
        setInterval(updateAllIndices, 5000); // Auto-refresh every 5 seconds to reduce API rate limit issues
    </script>
</body>
</html>
