<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Index Prices</title>
</head>
<body>
    <h1>Live Market Index Prices</h1>
    <p><strong>S&P 500 Price:</strong> <span id="sp500">Loading...</span></p>

    <script>
        const apiKey = "ZRD1DJCIMCB8HEZ1";  // Replace with your Alpha Vantage API key
        const symbol = "SPX";  // Symbol for S&P 500 Index

        fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${apiKey}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById("sp500").innerText = "$" + data["Global Quote"]["05. price"];
            })
            .catch(error => console.error("Error fetching data:", error));
    </script>
</body>
</html>
